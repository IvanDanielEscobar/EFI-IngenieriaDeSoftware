services:
  # Servicio de Base de Datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: homedeco_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: homedeco_db
      POSTGRES_USER: homedeco_user
      POSTGRES_PASSWORD: efi-ingenieria-de-software
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homedeco_user -d homedeco_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio Backend Django REST Framework
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homedeco_backend
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=homedeco_db
      - DB_USER=homedeco_user
      - DB_PASSWORD=efi-ingenieria-de-software
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run python manage.py runserver 0.0.0.0:8000"

# Volumen nombrado para persistencia de datos de PostgreSQL
volumes:
  postgres_data:
    name: homedeco_postgres_data
